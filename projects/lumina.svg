<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="luminaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A101D"/>
    </linearGradient>
    <linearGradient id="editorialGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#luminaBg)"/>

  <!-- High-fashion / Editorial Architectural Grid -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Typography Showcase Frame -->
  <g transform="translate(160, 100)">
    <rect width="880" height="475" rx="16" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
    
    <text x="60" y="70" fill="#3B82F6" font-family="monospace" font-size="12" letter-spacing="4">EDITORIAL SHOWCASE // VOL. 04</text>
    
    <text x="60" y="140" fill="url(#editorialGrad)" font-family="serif" font-size="52" font-weight="300" letter-spacing="-1">ARCHITECTURAL</text>
    <text x="60" y="200" fill="#FFFFFF" font-family="sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">SIMPLICITY.</text>

    <!-- Asymmetrical Layout Blocks -->
    <rect x="60" y="240" width="340" height="180" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="85" y="280" fill="#E2E8F0" font-family="sans-serif" font-size="16" font-weight="600">Fluid Responsive Form</text>
    <text x="85" y="310" fill="#94A3B8" font-family="sans-serif" font-size="13">Structured with CSS Grid fractions and</text>
    <text x="85" y="330" fill="#94A3B8" font-family="sans-serif" font-size="13">fine hairline borders for an editorial feel.</text>
    <rect x="85" y="360" width="100" height="28" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="135" y="378" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle">Read Article</text>

    <!-- Visual abstract card on right -->
    <rect x="430" y="240" width="390" height="180" rx="8" fill="rgba(6, 182, 212, 0.06)" stroke="rgba(6, 182, 212, 0.2)"/>
    <!-- Abstract geometric sculpture lines -->
    <circle cx="625" cy="330" r="60" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="6 3"/>
    <polygon points="625,280 675,360 575,360" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="625" y="400" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">100/100 Core Web Vitals</text>
  </g>
</svg>
