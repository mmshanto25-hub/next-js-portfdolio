<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="algoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="60%" stop-color="#0C1425"/>
      <stop offset="100%" stop-color="#07192C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#algoBg)"/>

  <!-- Visualizer Board Container -->
  <g transform="translate(140, 90)">
    <rect width="920" height="495" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Top toolbar -->
    <rect width="920" height="52" rx="16" fill="rgba(255, 255, 255, 0.03)"/>
    <text x="35" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="14">ALGO VISUALIZER // QUICKSORT &amp; GRAPH TRAVERSAL</text>
    <rect x="740" y="14" width="75" height="26" rx="4" fill="rgba(59, 130, 246, 0.2)"/>
    <text x="777" y="31" fill="#3B82F6" font-family="sans-serif" font-size="11" text-anchor="middle">Step 142</text>
    <rect x="825" y="14" width="75" height="26" rx="4" fill="#10B981"/>
    <text x="862" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">O(n log n)</text>

    <!-- Sorting Bars visual -->
    <g transform="translate(60, 360)">
      <!-- Bars representing sorting elements with heights and color states -->
      <rect x="0" y="-120" width="28" height="120" rx="4" fill="#3B82F6"/>
      <rect x="36" y="-190" width="28" height="190" rx="4" fill="#3B82F6"/>
      <rect x="72" y="-90" width="28" height="90" rx="4" fill="#3B82F6"/>
      <rect x="108" y="-240" width="28" height="240" rx="4" fill="#EF4444"/> <!-- Pivot -->
      <rect x="144" y="-140" width="28" height="140" rx="4" fill="#3B82F6"/>
      <rect x="180" y="-60" width="28" height="60" rx="4" fill="#3B82F6"/>
      <rect x="216" y="-210" width="28" height="210" rx="4" fill="#F59E0B"/> <!-- Comparing -->
      <rect x="252" y="-160" width="28" height="160" rx="4" fill="#F59E0B"/> <!-- Comparing -->
      <rect x="288" y="-100" width="28" height="100" rx="4" fill="#3B82F6"/>
      <rect x="324" y="-270" width="28" height="270" rx="4" fill="#3B82F6"/>
      <rect x="360" y="-80" width="28" height="80" rx="4" fill="#3B82F6"/>
      <rect x="396" y="-130" width="28" height="130" rx="4" fill="#3B82F6"/>
      <rect x="432" y="-40" width="28" height="40" rx="4" fill="#10B981"/> <!-- Sorted -->
      <rect x="468" y="-70" width="28" height="70" rx="4" fill="#10B981"/> <!-- Sorted -->
      <rect x="504" y="-110" width="28" height="110" rx="4" fill="#10B981"/> <!-- Sorted -->
    </g>

    <!-- Legend & controls -->
    <g transform="translate(620, 100)">
      <rect width="260" height="260" rx="10" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255,255,255,0.06)"/>
      <text x="25" y="35" fill="#E2E8F0" font-family="sans-serif" font-weight="600" font-size="14">Execution State</text>
      
      <circle cx="30" cy="70" r="6" fill="#EF4444"/>
      <text x="50" y="75" fill="#94A3B8" font-family="sans-serif" font-size="13">Partition Pivot</text>

      <circle cx="30" cy="110" r="6" fill="#F59E0B"/>
      <text x="50" y="115" fill="#94A3B8" font-family="sans-serif" font-size="13">Pointer Comparison</text>

      <circle cx="30" cy="150" r="6" fill="#10B981"/>
      <text x="50" y="155" fill="#94A3B8" font-family="sans-serif" font-size="13">Sorted Subarray</text>

      <circle cx="30" cy="190" r="6" fill="#3B82F6"/>
      <text x="50" y="195" fill="#94A3B8" font-family="sans-serif" font-size="13">Pending Evaluation</text>

      <rect x="25" y="220" width="210" height="26" rx="4" fill="rgba(255,255,255,0.06)"/>
      <text x="130" y="238" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">Delay: 45ms / Step</text>
    </g>

    <!-- Bottom summary -->
    <rect x="50" y="400" width="820" height="60" rx="8" fill="rgba(255, 255, 255, 0.02)"/>
    <text x="70" y="435" fill="#94A3B8" font-family="monospace" font-size="12">Algorithm: QuickSort (Hoare Partition) | Comparisons: 184 | Swaps: 47 | Status: Partitioning Right Subarray</text>
  </g>
</svg>
