<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="zenithBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="60%" stop-color="#0E132A"/>
      <stop offset="100%" stop-color="#140D2B"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="zenithGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#zenithBg)"/>
  
  <!-- Subtle UI system grid -->
  <g stroke="rgba(139, 92, 246, 0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
  </g>

  <!-- Ambient lights -->
  <circle cx="280" cy="180" r="180" fill="#8B5CF6" opacity="0.12" filter="url(#zenithGlow)"/>
  <circle cx="950" cy="450" r="160" fill="#3B82F6" opacity="0.12" filter="url(#zenithGlow)"/>

  <!-- UI Token Board -->
  <!-- Primary Component Sandbox Card -->
  <g transform="translate(140, 100)">
    <!-- Main Shell -->
    <rect width="920" height="475" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="920" height="48" rx="16" fill="rgba(255, 255, 255, 0.02)"/>
    <text x="40" y="30" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="14">ZENITH DESIGN SYSTEM v2.4</text>
    <text x="880" y="30" fill="#8B5CF6" font-family="monospace" font-size="13" text-anchor="end">Figma Tokens → React</text>
    
    <!-- Component Samples Grid -->
    <!-- Button Primitives -->
    <rect x="50" y="80" width="250" height="170" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)"/>
    <text x="70" y="110" fill="#94A3B8" font-family="sans-serif" font-size="13">Button Primitives</text>
    <!-- Solid Button -->
    <rect x="70" y="130" width="210" height="38" rx="8" fill="url(#purpleGlow)"/>
    <text x="175" y="154" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13" text-anchor="middle">Primary Action</text>
    <!-- Outline Button -->
    <rect x="70" y="180" width="210" height="38" rx="8" fill="transparent" stroke="rgba(255,255,255,0.2)"/>
    <text x="175" y="204" fill="#E2E8F0" font-family="sans-serif" font-size="13" text-anchor="middle">Secondary Outline</text>

    <!-- Dialog / Modal Sample -->
    <rect x="330" y="80" width="270" height="170" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)"/>
    <text x="350" y="110" fill="#94A3B8" font-family="sans-serif" font-size="13">Input &amp; Validation</text>
    <!-- Input Box -->
    <rect x="350" y="130" width="230" height="38" rx="8" fill="rgba(0,0,0,0.4)" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="365" y="154" fill="#F8FAFC" font-family="monospace" font-size="12">shanto.dev/token</text>
    <!-- Tag badges -->
    <rect x="350" y="185" width="60" height="24" rx="12" fill="rgba(59, 130, 246, 0.2)"/>
    <text x="380" y="201" fill="#60A5FA" font-family="sans-serif" font-size="11" text-anchor="middle">Active</text>
    <rect x="420" y="185" width="70" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="455" y="201" fill="#34D399" font-family="sans-serif" font-size="11" text-anchor="middle">Verified</text>
    <rect x="500" y="185" width="60" height="24" rx="12" fill="rgba(139, 92, 246, 0.2)"/>
    <text x="530" y="201" fill="#C084FC" font-family="sans-serif" font-size="11" text-anchor="middle">Dark</text>

    <!-- Color Spectrum Palette -->
    <rect x="630" y="80" width="240" height="170" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)"/>
    <text x="650" y="110" fill="#94A3B8" font-family="sans-serif" font-size="13">Design Tokens Ramp</text>
    <rect x="650" y="130" width="35" height="35" rx="6" fill="#050816" stroke="rgba(255,255,255,0.2)"/>
    <rect x="690" y="130" width="35" height="35" rx="6" fill="#0F172A"/>
    <rect x="730" y="130" width="35" height="35" rx="6" fill="#3B82F6"/>
    <rect x="770" y="130" width="35" height="35" rx="6" fill="#06B6D4"/>
    <rect x="810" y="130" width="35" height="35" rx="6" fill="#8B5CF6"/>
    <text x="650" y="195" fill="#64748B" font-family="sans-serif" font-size="12">Typography: Space Grotesk / Inter</text>
    <text x="650" y="215" fill="#64748B" font-family="sans-serif" font-size="12">Elevation: 4 Levels | Radius: 16px</text>

    <!-- Glassmorphic Card Showcase Bottom -->
    <rect x="50" y="275" width="820" height="160" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="75" y="310" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="15">Interactive Accessible Surface Primitive</text>
    <text x="75" y="335" fill="#94A3B8" font-family="sans-serif" font-size="13">Component meets strict WCAG AA contrast standards with built-in keyboard focus ring states.</text>

    <!-- Visual toggle switch -->
    <rect x="75" y="360" width="50" height="26" rx="13" fill="#8B5CF6"/>
    <circle cx="112" cy="373" r="10" fill="#FFFFFF"/>
    <text x="140" y="378" fill="#E2E8F0" font-family="sans-serif" font-size="13">Smooth Motion Micro-Interaction</text>
  </g>
</svg>
