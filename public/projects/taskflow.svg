<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="taskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="60%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#taskBg)"/>

  <!-- Kanban Container -->
  <g transform="translate(120, 90)">
    <rect width="960" height="495" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="960" height="52" rx="16" fill="rgba(255, 255, 255, 0.03)"/>
    <text x="35" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="14">TASKFLOW // SPRINT BOARD</text>
    <circle cx="910" cy="26" r="10" fill="#3B82F6"/>
    <text x="910" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle">S</text>

    <!-- 3 Kanban Columns -->
    <!-- Column 1: Backlog -->
    <rect x="35" y="75" width="280" height="390" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255,255,255,0.06)"/>
    <text x="55" y="105" fill="#94A3B8" font-family="sans-serif" font-weight="600" font-size="13">BACKLOG (3)</text>
    
    <!-- Card 1.1 -->
    <rect x="50" y="125" width="250" height="75" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255,255,255,0.08)"/>
    <text x="65" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="13">Refactor auth middleware</text>
    <rect x="65" y="165" width="50" height="18" rx="4" fill="rgba(239, 68, 68, 0.2)"/>
    <text x="90" y="178" fill="#F87171" font-family="sans-serif" font-size="10" text-anchor="middle">High</text>

    <!-- Card 1.2 -->
    <rect x="50" y="215" width="250" height="75" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255,255,255,0.08)"/>
    <text x="65" y="240" fill="#FFFFFF" font-family="sans-serif" font-size="13">Add dark theme tokens</text>
    <rect x="65" y="255" width="60" height="18" rx="4" fill="rgba(59, 130, 246, 0.2)"/>
    <text x="95" y="268" fill="#60A5FA" font-family="sans-serif" font-size="10" text-anchor="middle">Design</text>

    <!-- Column 2: In Progress -->
    <rect x="340" y="75" width="280" height="390" rx="10" fill="rgba(59, 130, 246, 0.03)" stroke="rgba(59, 130, 246, 0.2)"/>
    <text x="360" y="105" fill="#3B82F6" font-family="sans-serif" font-weight="600" font-size="13">IN PROGRESS (2)</text>

    <!-- Dragging card -->
    <rect x="355" y="125" width="250" height="85" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="370" y="150" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Drag &amp; drop event bridge</text>
    <text x="370" y="170" fill="#94A3B8" font-family="sans-serif" font-size="11">Active drag pointer state</text>
    <rect x="370" y="180" width="70" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="405" y="193" fill="#34D399" font-family="sans-serif" font-size="10" text-anchor="middle">Frontend</text>

    <!-- Column 3: Completed -->
    <rect x="645" y="75" width="280" height="390" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255,255,255,0.06)"/>
    <text x="665" y="105" fill="#10B981" font-family="sans-serif" font-weight="600" font-size="13">COMPLETED (8)</text>

    <rect x="660" y="125" width="250" height="75" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
    <text x="675" y="150" fill="#94A3B8" font-family="sans-serif" font-size="13" text-decoration="line-through">Setup Next.js 15 template</text>
    <rect x="675" y="165" width="55" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="702" y="178" fill="#10B981" font-family="sans-serif" font-size="10" text-anchor="middle">Done</text>
  </g>
</svg>
