<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="accentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="36" fill="url(#avatarBg)"/>

  <!-- Outer ambient ring -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#accentRing)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="250" cy="250" r="180" fill="rgba(59, 130, 246, 0.05)"/>

  <!-- Glowing inner circle -->
  <circle cx="250" cy="250" r="160" fill="none" stroke="url(#accentRing)" stroke-width="3" filter="url(#avatarGlow)"/>

  <!-- Geometric Developer Silhouette -->
  <!-- Shoulders -->
  <path d="M 140 400 C 140 330, 200 300, 250 300 C 300 300, 360 330, 360 400 Z" fill="rgba(59, 130, 246, 0.25)" stroke="#3B82F6" stroke-width="1.5"/>
  <!-- Head & Hair -->
  <circle cx="250" cy="220" r="65" fill="#1E293B" stroke="url(#accentRing)" stroke-width="2"/>
  <!-- Modern Glasses / Tech Specs -->
  <rect x="210" y="205" width="32" height="20" rx="4" fill="rgba(6, 182, 212, 0.2)" stroke="#06B6D4" stroke-width="2"/>
  <rect x="258" y="205" width="32" height="20" rx="4" fill="rgba(6, 182, 212, 0.2)" stroke="#06B6D4" stroke-width="2"/>
  <line x1="242" y1="215" x2="258" y2="215" stroke="#06B6D4" stroke-width="2"/>

  <!-- Code Monogram Badge -->
  <rect x="195" y="325" width="110" height="32" rx="16" fill="#0F172A" stroke="url(#accentRing)" stroke-width="1.5"/>
  <text x="250" y="346" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">&lt;SHANTO /&gt;</text>
</svg>
